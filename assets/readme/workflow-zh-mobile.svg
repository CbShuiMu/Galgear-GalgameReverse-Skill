<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1240" viewBox="0 0 600 1240" role="img" aria-labelledby="title desc">
  <title id="title">GalSkill：通用资源主线与按需分支</title>
  <desc id="desc">主线依次为 GalExtract 解包、按需修改资源副本和 GalPack 封包验证。GalTTS 是可选语音生成分支，生成结果交给 GalPack。遇到未知格式或加载障碍时按需使用 GalReverse。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#087a78" stroke-width="1.7" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="600" height="1240" rx="20" fill="#f3f7f5"/>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <g id="heading">
      <text x="36" y="52" font-size="34" font-weight="700" fill="#19343d">按需求选择资源处理路线</text>
      <text x="36" y="91" font-size="25" fill="#53676f">脚本 · 图像 · 音频 · 视频 · 字体等</text>
    </g>

    <g id="extract" transform="translate(48 126)">
      <rect width="504" height="160" rx="16" fill="#ffffff" stroke="#d4dfdb"/>
      <text x="26" y="37" font-size="25" font-weight="600" fill="#087a78">01 / 解包与按需解析</text>
      <text x="26" y="88" font-size="42" font-weight="700" fill="#19343d">GalExtract</text>
      <text x="26" y="132" font-size="28" fill="#53676f">保留原样资源和完整路径</text>
    </g>
    <path d="M300 298 V338" fill="none" stroke="#087a78" stroke-width="3" marker-end="url(#arrow)"/>

    <g id="resource-editing" transform="translate(48 350)">
      <rect width="504" height="160" rx="16" fill="#ffffff" stroke="#d4dfdb"/>
      <text x="26" y="37" font-size="25" font-weight="600" fill="#087a78">02 / 按用户需求处理</text>
      <text x="26" y="88" font-size="40" font-weight="700" fill="#19343d">修改资源副本</text>
      <text x="26" y="132" font-size="28" fill="#53676f">按资源类型核对格式与引用</text>
    </g>
    <path d="M300 522 V562" fill="none" stroke="#087a78" stroke-width="3" marker-end="url(#arrow)"/>

    <g id="pack" transform="translate(48 574)">
      <rect width="504" height="160" rx="16" fill="#ffffff" stroke="#d4dfdb"/>
      <text x="26" y="37" font-size="25" font-weight="600" fill="#087a78">03 / 封包与往返验证</text>
      <text x="26" y="88" font-size="42" font-weight="700" fill="#19343d">GalPack</text>
      <text x="26" y="132" font-size="28" fill="#53676f">合并修改，保留其余资源</text>
    </g>

    <g id="optional-tts-route" transform="translate(48 798)">
      <rect width="504" height="188" rx="16" fill="#fff9f5" stroke="#e5cfc3" stroke-dasharray="7 6"/>
      <text x="26" y="37" font-size="25" font-weight="600" fill="#a34d38">可选分支 / 需要中文配音时</text>
      <text x="26" y="88" font-size="40" font-weight="700" fill="#19343d">GalTTS</text>
      <text x="26" y="132" font-size="27" fill="#53676f">已确认对白与参考音频 → 替换语音</text>
      <text x="26" y="169" font-size="27" fill="#a34d38">生成后交给 GalPack 封包</text>
    </g>

    <g id="reverse-support" transform="translate(48 1042)">
      <rect width="504" height="158" rx="16" fill="#eaf1f5" stroke="#c9dbe5"/>
      <text x="26" y="49" font-size="36" font-weight="700" fill="#426d83">GalReverse</text>
      <text x="26" y="91" font-size="27" fill="#19343d">未知格式或加载障碍 → 按需分析</text>
      <text x="26" y="130" font-size="26" fill="#53676f">验证方法后返回当前任务</text>
    </g>
  </g>
</svg>